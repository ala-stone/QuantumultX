# ── 防 DoH 绕过（默认关闭！）────────────────────────────────
# 广告 SDK 会用内置 DoH 自解析来绕开域名拦截。
# 但如果你自己的配置里开了 doh-server（阿里/腾讯 DoH），这两条会把
# 全设备的 DNS 查询一起拒掉 —— 务必先确认没开。
# host-suffix, dns.alidns.com, reject
# host-suffix, doh.pub, reject


[rewrite_local]

# ── 方案 A：纯规则版（零依赖，推荐先用这个）──────────────────
# 直接返回一个空 JSON 对象 {}。SDK 视为"本次无广告"，不会重试，
# 比 reject 更干净（reject 会断开连接，SDK 当网络错误反复重试）。
^https?:\/\/[^\/]+pangolin-sdk-toutiao[^\/]*\/api\/ad\/union\/sdk\/ url reject-dict

# ── 方案 B：脚本版（能力更强，需要托管 js + MITM）────────────
# 把 hongguo-ad.js 传到 GitHub Gist / 任意可直链的地方，
# 用 raw 地址替换下面 <SCRIPT_URL>，然后注释掉方案 A 那一行。
# ^https?:\/\/[^\/]+pangolin-sdk-toutiao[^\/]*\/api\/ad\/union\/sdk\/ url script-response-body <SCRIPT_URL>

# ── 可选：连红果自有 API 里的广告字段一起清（风险高，见 README）──
# ^https?:\/\/[^\/]+\.snssdk\.com\/api\/ad\/ url script-response-body <SCRIPT_URL>


[mitm]

# 只有启用「方案 B 脚本版」或上面的可选段，才需要这两行。
# 注意 QX 的 rewrite_remote 不会自动注入 MITM 主机名，必须手写进 profile。
# hostname = *.pangolin-sdk-toutiao.com, *.pangolin-sdk-toutiao-b.com, *.pangolin-sdk-toutiao1.com
