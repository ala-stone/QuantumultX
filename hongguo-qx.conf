# ============================================================
#  红果短剧 去广告 · Quantumult X 配置片段
# ------------------------------------------------------------
#  用法：把下面每一段的内容，合并进你 profile 里同名的段落，
#        不要直接整体覆盖整个配置文件。
#  分级：
#    [filter_local]  → 域名拒绝，不需要 MITM，最快见效
#    [rewrite_local] → 需要 MITM + 证书，用来改写响应体
#    [mitm]          → 只有启用脚本版才需要加 hostname
# ============================================================


[filter_local]

# ── 穿山甲 / Pangle 广告 SDK ────────────────────────────────
# 关键词一条覆盖 pangolin-sdk-toutiao{,-b,1}.com 及其 api-access.* / log-api.* 子域
host-keyword, pangolin, reject
host-suffix, pangle.io, reject
host-suffix, pglstatp-toutiao.com, reject
host-suffix, pglstatp-toutiao-b.com, reject

# ── 插播广告视频 CDN（红果/番茄共用）────────────────────────
# 关键：广告与正片走不同子域
#   正片  v*-reading-video.qznovelvod.com   → 不动
#   广告  v*-reading-ad.qznovelvod.com      → 拦截
# 用 host-keyword 而不是逐条列举，是为了覆盖以后新增的 v7/v8/v100 等节点
host-keyword, -reading-ad.qznovelvod.com, reject

# 如果上面那条误伤（极少见），换成下面这组已验证的精确列表：
# host-suffix, v5-reading-ad.qznovelvod.com, reject
# host-suffix, v6-reading-ad.qznovelvod.com, reject
# host-suffix, v9-reading-ad.qznovelvod.com, reject
# host-suffix, v11-reading-ad.qznovelvod.com, reject
# host-suffix, v13-reading-ad.qznovelvod.com, reject
# host-suffix, v26-reading-ad.qznovelvod.com, reject
# host-suffix, v96-reading-ad.qznovelvod.com, reject
# host-suffix, v5-bd-daily-reading-ad.qznovelvod.com, reject
# host-suffix, v5-se-sjy-daily-reading-ad.qznovelvod.com, reject

